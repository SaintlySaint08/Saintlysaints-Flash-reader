<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flashword — RSVP Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10;
    --bg-raised:#14171B;
    --text:#EDEAE3;
    --text-dim:#8B8F96;
    --border:#2B2F36;
    --pivot:#FF4E2E;
    --active:#5EEAD4;
    --active-dim:#2A4A46;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- SETUP SCREEN ---------- */
  #setup{
    flex:1; display:flex; flex-direction:column;
    padding:28px 22px; gap:18px; overflow-y:auto;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
  }
  .brand-mark{
    width:10px; height:10px; border-radius:50%;
    background:var(--pivot);
    box-shadow:0 0 12px var(--pivot);
  }
  .brand h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; margin:0;
    letter-spacing:-0.02em;
  }
  .brand span{color:var(--text-dim); font-size:13px; font-family:'IBM Plex Mono',monospace;}

  textarea{
    flex:1; min-height:160px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    padding:16px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.55;
    resize:none;
    outline:none;
  }
  textarea:focus{border-color:var(--active);}
  textarea::placeholder{color:var(--text-dim);}

  .row-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:8px;
    display:flex; justify-content:space-between;
  }
  .row-label b{color:var(--active); font-weight:600;}

  .speed-control{
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px;
    background:var(--border);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--active);
    box-shadow:0 0 0 4px var(--active-dim);
    cursor:pointer;
  }

  .chunk-toggle{
    display:flex; gap:8px;
  }
  .chunk-btn{
    flex:1; padding:12px 0;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .chunk-btn.active{
    border-color:var(--active);
    color:var(--active);
    background:var(--active-dim);
  }

  .book-search{
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
  }
  .row-label span{color:var(--text-dim); font-weight:400; text-transform:none; letter-spacing:0;}
  .book-search-row{
    display:flex; gap:8px;
  }
  .book-search-row input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  .book-search-row input:focus{border-color:var(--active);}
  .book-search-row button{
    background:var(--active);
    color:#0B0D10;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .book-search-row button:disabled{background:var(--border); color:var(--text-dim);}
  #bookResults{
    display:flex; flex-direction:column; gap:6px;
    margin-top:10px;
  }
  .book-result{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
  }
  .book-result-info{overflow:hidden;}
  .book-result-title{
    font-size:13px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-result-author{
    font-size:11px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-result-btn{
    flex-shrink:0;
    background:none;
    border:1px solid var(--active);
    color:var(--active);
    border-radius:8px;
    padding:7px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600;
    cursor:pointer;
  }
  .book-result-btn:disabled{border-color:var(--border); color:var(--text-dim); cursor:default;}
  .book-status{
    font-size:12px; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    padding:4px 2px;
  }

  .color-toggle{
    display:flex; gap:10px;
  }
  .color-swatch{
    width:36px; height:36px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
  }
  .color-swatch.active{
    border-color:var(--text);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--border);
  }

  .start-btn{
    background:var(--pivot);
    color:#0B0D10;
    border:none;
    border-radius:14px;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px; font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
    text-transform:uppercase;
  }
  .start-btn:disabled{
    background:var(--border); color:var(--text-dim);
  }
  .meta-row{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--text-dim);
  }
  .sample-link{color:var(--active); text-decoration:none; cursor:pointer;}

  /* ---------- READER SCREEN ---------- */
  #reader{
    display:none;
    flex:1; flex-direction:column;
    position:relative;
  }
  .reader-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
  }
  .icon-btn{
    background:none; border:none; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    cursor:pointer; padding:8px;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:active{color:var(--text);}
  .wpm-display{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--active);
  }

  .stage{
    flex:1; position:relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .crosshair-v{
    position:absolute; top:0; bottom:0; left:50%;
    width:1px; background:var(--border);
  }
  .crosshair-tick{
    position:absolute; left:50%; transform:translateX(-50%);
    width:1px; height:14px; background:var(--text-dim); opacity:0.5;
  }
  .tick-top{top:calc(50% - 62px);}
  .tick-bottom{top:calc(50% + 48px);}

  .word-display{
    font-family:'IBM Plex Mono',monospace;
    font-size:42px; font-weight:600;
    letter-spacing:-0.01em;
    white-space:nowrap;
    position:relative;
    line-height:1;
  }
  .pivot-char{color:var(--pivot);}

  @media (min-width:600px){
    .word-display{font-size:56px;}
  }

  .progress-wrap{
    width:80%; max-width:420px;
    margin-top:44px;
    padding:14px 0;
    cursor:pointer;
    touch-action:none;
  }
  .progress-track{
    width:100%;
    height:4px;
    background:var(--border);
    border-radius:2px;
    position:relative;
    overflow:visible;
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--active);
    width:0%;
    border-radius:2px;
  }
  .progress-thumb{
    position:absolute; top:50%; left:0%;
    width:14px; height:14px; border-radius:50%;
    background:var(--active);
    box-shadow:0 0 0 4px var(--active-dim);
    transform:translate(-50%,-50%);
  }
  .progress-percent{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--active);
    font-weight:600;
    margin-top:10px;
  }

  .reader-bottom{
    padding:24px 20px 32px;
    display:flex; flex-direction:column; gap:16px;
  }
  .controls-row{
    display:flex; align-items:center; justify-content:center; gap:28px;
  }
  .ctrl-btn{
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text);
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ctrl-btn svg{width:20px; height:20px;}
  #playPauseBtn{
    width:68px; height:68px;
    background:var(--pivot);
    border:none;
  }
  #playPauseBtn svg{width:26px; height:26px; fill:#0B0D10;}

  .speed-mini{
    display:flex; align-items:center; gap:12px;
    padding:0 8px;
  }
  .speed-mini input[type=range]{flex:1;}
  .speed-mini span{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-dim); width:52px; text-align:right;
  }

  .status-line{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-dim);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="setup">
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>FLASHWORD</h1>
      <span>rsvp reader</span>
    </div>

    <div class="book-search">
      <div class="row-label">Find a free book <span id="bookSourceNote">Project Gutenberg</span></div>
      <div class="book-search-row">
        <input type="text" id="bookQuery" placeholder="Search title or author…">
        <button id="bookSearchBtn">Search</button>
      </div>
      <div id="bookResults"></div>
    </div>

    <textarea id="textInput" placeholder="Paste or type the text you want to speed-read…"></textarea>

    <div class="meta-row">
      <span id="wordCount">0 words · ~0:00 at current speed</span>
      <span style="display:flex; gap:14px;">
        <span class="sample-link" id="clearBtn">clear text</span>
        <span class="sample-link" id="sampleBtn">try sample text</span>
      </span>
    </div>

    <div class="speed-control">
      <div class="row-label">Speed <b id="wpmLabel">300 wpm</b></div>
      <input type="range" id="wpmSlider" min="100" max="800" step="10" value="300">
    </div>

    <div>
      <div class="row-label">Words per flash</div>
      <div class="chunk-toggle">
        <button class="chunk-btn active" data-chunk="1">1</button>
        <button class="chunk-btn" data-chunk="2">2</button>
        <button class="chunk-btn" data-chunk="3">3</button>
      </div>
    </div>

    <div>
      <div class="row-label">Pivot letter color</div>
      <div class="color-toggle" id="colorToggle">
        <button class="color-swatch active" data-color="#FF4E2E" style="background:#FF4E2E" aria-label="Red"></button>
        <button class="color-swatch" data-color="#5EEAD4" style="background:#5EEAD4" aria-label="Teal"></button>
        <button class="color-swatch" data-color="#60A5FA" style="background:#60A5FA" aria-label="Blue"></button>
        <button class="color-swatch" data-color="#C084FC" style="background:#C084FC" aria-label="Purple"></button>
        <button class="color-swatch" data-color="#FACC15" style="background:#FACC15" aria-label="Yellow"></button>
        <button class="color-swatch" data-color="#4ADE80" style="background:#4ADE80" aria-label="Green"></button>
        <button class="color-swatch" data-color="#F472B6" style="background:#F472B6" aria-label="Pink"></button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" disabled>Start reading</button>
  </div>

  <!-- READER -->
  <div id="reader">
    <div class="reader-top">
      <button class="icon-btn" id="exitBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
        back to text
      </button>
      <div class="wpm-display" id="readerWpmLabel">300 WPM</div>
    </div>

    <div class="stage">
      <div class="crosshair-v"></div>
      <div class="crosshair-tick tick-top"></div>
      <div class="crosshair-tick tick-bottom"></div>
      <div class="word-display" id="wordDisplay">READY</div>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <div class="reader-bottom">
      <div class="status-line" id="statusLine">0 / 0 words</div>
      <div class="controls-row">
        <button class="ctrl-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>
        </button>
        <button class="ctrl-btn" id="playPauseBtn">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="fwdBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
        </button>
      </div>
      <div class="speed-mini">
        <span id="miniWpmMin">speed</span>
        <input type="range" id="wpmSliderReader" min="100" max="800" step="10" value="300">
        <span id="miniWpmMax">800</span>
      </div>
      <div class="speed-mini">
        <span>skip</span>
        <input type="range" id="skipSlider" min="1" max="50" step="1" value="5">
        <span id="skipLabel">5 words</span>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const setup = document.getElementById('setup');
  const reader = document.getElementById('reader');
  const textInput = document.getElementById('textInput');
  const wordCountEl = document.getElementById('wordCount');
  const wpmSlider = document.getElementById('wpmSlider');
  const wpmLabel = document.getElementById('wpmLabel');
  const wpmSliderReader = document.getElementById('wpmSliderReader');
  const readerWpmLabel = document.getElementById('readerWpmLabel');
  const startBtn = document.getElementById('startBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const clearBtn = document.getElementById('clearBtn');
  const colorToggle = document.getElementById('colorToggle');
  const chunkBtns = document.querySelectorAll('.chunk-btn');
  const exitBtn = document.getElementById('exitBtn');
  const wordDisplay = document.getElementById('wordDisplay');
  const progressFill = document.getElementById('progressFill');
  const statusLine = document.getElementById('statusLine');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const playIcon = document.getElementById('playIcon');
  const backBtn = document.getElementById('backBtn');
  const fwdBtn = document.getElementById('fwdBtn');
  const skipSlider = document.getElementById('skipSlider');
  const skipLabel = document.getElementById('skipLabel');
  const progressWrap = document.getElementById('progressWrap');
  const progressTrack = document.getElementById('progressTrack');
  const progressThumb = document.getElementById('progressThumb');
  const progressPercent = document.getElementById('progressPercent');
  const bookQuery = document.getElementById('bookQuery');
  const bookSearchBtn = document.getElementById('bookSearchBtn');
  const bookResults = document.getElementById('bookResults');

  let wpm = 300;
  let chunkSize = 1;
  let words = [];
  let chunks = [];
  let idx = 0;
  let playing = false;
  let timer = null;
  let skipAmount = 5;
  let dragging = false;

  const SAMPLE = "Speed reading with RSVP works by flashing one word at a time at a fixed point on the screen so your eyes never have to move. Most of the time we spend reading is actually spent moving our eyes across the page, not processing the words themselves. By removing that movement entirely, you can comfortably read at speeds that would otherwise feel rushed. The trick your eyes are using right now is called the optical recognition point, a spot slightly left of a word's center where your brain identifies it fastest. This reader highlights that exact letter in every word, so your focus stays locked in one place while the words move past it.";

  function wordsFromText(text){
    return text.trim().split(/\s+/).filter(w => w.length > 0);
  }

  function buildChunks(){
    chunks = [];
    for(let i=0; i<words.length; i+=chunkSize){
      chunks.push(words.slice(i, i+chunkSize).join(' '));
    }
  }

  function estimateTime(){
    const n = wordsFromText(textInput.value).length;
    const secs = Math.round((n / wpm) * 60);
    const m = Math.floor(secs/60), s = secs%60;
    wordCountEl.textContent = `${n} words · ~${m}:${s.toString().padStart(2,'0')} at current speed`;
    startBtn.disabled = n === 0;
  }

  function pivotIndex(word){
    const len = word.length;
    if(len <= 1) return 0;
    if(len <= 5) return 1;
    if(len <= 9) return 2;
    if(len <= 13) return 3;
    return 4;
  }

  function renderWord(chunkStr){
    // Only apply pivot highlight when chunk is a single word
    if(chunkSize === 1){
      const w = chunkStr;
      const pi = pivotIndex(w);
      const before = w.slice(0, pi);
      const pivotChar = w.slice(pi, pi+1);
      const after = w.slice(pi+1);
      wordDisplay.innerHTML = `${escapeHtml(before)}<span class="pivot-char">${escapeHtml(pivotChar)}</span>${escapeHtml(after)}`;
    } else {
      wordDisplay.textContent = chunkStr;
    }
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateStatus(){
    const pct = (idx / Math.max(chunks.length-1,1)) * 100;
    statusLine.textContent = `${idx+1} / ${chunks.length} chunks · ${words.length} words total`;
    progressFill.style.width = `${pct}%`;
    progressThumb.style.left = `${pct}%`;
    progressPercent.textContent = `${Math.round(pct)}%`;
  }

  function showCurrent(){
    if(chunks.length === 0) return;
    renderWord(chunks[idx]);
    updateStatus();
  }

  function msPerChunk(){
    // ms per word * words in chunk
    return (60000 / wpm) * chunkSize;
  }

  function tick(){
    if(idx >= chunks.length - 1){
      pause();
      return;
    }
    idx++;
    showCurrent();
    timer = setTimeout(tick, msPerChunk());
  }

  function play(){
    if(chunks.length === 0) return;
    if(idx >= chunks.length - 1) idx = 0;
    playing = true;
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    timer = setTimeout(tick, msPerChunk());
  }

  function pause(){
    playing = false;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    clearTimeout(timer);
  }

  function togglePlay(){
    if(playing) pause(); else play();
  }

  // ---- setup screen events ----
  textInput.addEventListener('input', estimateTime);

  wpmSlider.addEventListener('input', () => {
    wpm = parseInt(wpmSlider.value);
    wpmLabel.textContent = `${wpm} wpm`;
    wpmSliderReader.value = wpm;
    readerWpmLabel.textContent = `${wpm} WPM`;
    estimateTime();
  });

  wpmSliderReader.addEventListener('input', () => {
    wpm = parseInt(wpmSliderReader.value);
    readerWpmLabel.textContent = `${wpm} WPM`;
    wpmSlider.value = wpm;
    wpmLabel.textContent = `${wpm} wpm`;
    if(playing){ pause(); play(); }
  });

  chunkBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      chunkBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chunkSize = parseInt(btn.dataset.chunk);
    });
  });

  sampleBtn.addEventListener('click', () => {
    textInput.value = SAMPLE;
    estimateTime();
  });

  clearBtn.addEventListener('click', () => {
    textInput.value = '';
    estimateTime();
    textInput.focus();
  });

  colorToggle.addEventListener('click', (e) => {
    const swatch = e.target.closest('.color-swatch');
    if(!swatch) return;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    document.documentElement.style.setProperty('--pivot', swatch.dataset.color);
  });

  startBtn.addEventListener('click', () => {
    words = wordsFromText(textInput.value);
    if(words.length === 0) return;
    buildChunks();
    idx = 0;
    setup.style.display = 'none';
    reader.style.display = 'flex';
    showCurrent();
  });

  exitBtn.addEventListener('click', () => {
    pause();
    reader.style.display = 'none';
    setup.style.display = 'flex';
  });

  playPauseBtn.addEventListener('click', togglePlay);

  backBtn.addEventListener('click', () => {
    pause();
    idx = Math.max(0, idx - skipAmount);
    showCurrent();
  });

  fwdBtn.addEventListener('click', () => {
    pause();
    idx = Math.min(chunks.length - 1, idx + skipAmount);
    showCurrent();
  });

  document.getElementById('stage')?.addEventListener('click', togglePlay);
  document.querySelector('.stage').addEventListener('click', togglePlay);

  skipSlider.addEventListener('input', () => {
    skipAmount = parseInt(skipSlider.value);
    skipLabel.textContent = `${skipAmount} words`;
  });

  // ---- progress bar drag-to-seek ----
  function seekFromClientX(clientX){
    if(chunks.length === 0) return;
    const rect = progressTrack.getBoundingClientRect();
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.min(1, Math.max(0, ratio));
    idx = Math.round(ratio * (chunks.length - 1));
    showCurrent();
  }

  progressWrap.addEventListener('pointerdown', (e) => {
    if(chunks.length === 0) return;
    e.stopPropagation();
    dragging = true;
    pause();
    seekFromClientX(e.clientX);
    try{ progressWrap.setPointerCapture(e.pointerId); }catch(err){}
  });
  progressWrap.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    e.stopPropagation();
    seekFromClientX(e.clientX);
  });
  progressWrap.addEventListener('pointerup', (e) => {
    dragging = false;
    e.stopPropagation();
  });
  progressWrap.addEventListener('pointercancel', () => { dragging = false; });
  progressWrap.addEventListener('click', (e) => e.stopPropagation());

  // ---- book search (Project Gutenberg via Gutendex) ----
  function stripGutenbergBoilerplate(text){
    const startMatch = text.match(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i);
    const endMatch = text.match(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i);
    let start = startMatch ? startMatch.index + startMatch[0].length : 0;
    let end = endMatch ? endMatch.index : text.length;
    if(end <= start) end = text.length;
    return text.slice(start, end).trim();
  }

  // ---- fetch helpers with CORS-proxy fallback ----
  async function fetchWithFallback(url, asJson){
    const attempts = [
      () => fetch(url),
      () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)),
      () => fetch('https://corsproxy.io/?' + encodeURIComponent(url))
    ];
    if(!asJson){
      attempts.push(() => fetch('https://r.jina.ai/' + url));
    }
    let lastErr = null;
    for(const attempt of attempts){
      try{
        const r = await attempt();
        if(r.ok) return asJson ? await r.json() : await r.text();
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('all fetch attempts failed');
  }

  async function searchBooks(){
    const q = bookQuery.value.trim();
    if(!q) return;
    bookSearchBtn.disabled = true;
    bookResults.innerHTML = `<div class="book-status">Searching…</div>`;
    try{
      const data = await fetchWithFallback(`https://gutendex.com/books/?search=${encodeURIComponent(q)}`, true);
      const list = (data.results || []).slice(0, 8);
      if(list.length === 0){
        bookResults.innerHTML = `<div class="book-status">No results. Try a different title or author.</div>`;
        return;
      }
      bookResults.innerHTML = '';
      list.forEach(book => {
        const authors = (book.authors || []).map(a => a.name).join(', ') || 'Unknown author';
        const row = document.createElement('div');
        row.className = 'book-result';
        row.innerHTML = `
          <div class="book-result-info">
            <div class="book-result-title">${escapeHtml(book.title)}</div>
            <div class="book-result-author">${escapeHtml(authors)}</div>
          </div>
          <button class="book-result-btn">Load</button>
        `;
        const loadBtn = row.querySelector('.book-result-btn');
        loadBtn.addEventListener('click', () => loadBook(book, loadBtn));
        bookResults.appendChild(row);
      });
    }catch(err){
      bookResults.innerHTML = `<div class="book-status">Search failed — check your connection and try again.</div>`;
    }finally{
      bookSearchBtn.disabled = false;
    }
  }

  async function loadBook(book, btnEl){
    const formats = book.formats || {};
    const txtUrl = formats['text/plain; charset=utf-8'] || formats['text/plain; charset=us-ascii'] || formats['text/plain'];
    if(!txtUrl){
      btnEl.textContent = 'No text file';
      btnEl.disabled = true;
      return;
    }
    const originalLabel = btnEl.textContent;
    btnEl.textContent = 'Loading…';
    btnEl.disabled = true;
    try{
      const raw = await fetchWithFallback(txtUrl, false);
      const cleaned = stripGutenbergBoilerplate(raw);
      textInput.value = cleaned;
      estimateTime();
      btnEl.textContent = 'Loaded ✓';
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(err){
      btnEl.textContent = 'Failed — open link';
      btnEl.disabled = false;
      btnEl.onclick = () => window.open(txtUrl, '_blank');
    }
  }

  bookSearchBtn.addEventListener('click', searchBooks);
  bookQuery.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); searchBooks(); }
  });

  estimateTime();
})();
</script>
